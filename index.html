<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROLL COLOR DICE - TINY COMPACT</title>
    <style>
        /* CSS THUẦN - Thiết kế siêu thu nhỏ, gọn gàng tối đa */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b0f19; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 6px; color: white; }
        
        .app-container {
            width: 100%; max-w: 260px; background-color: #131a26; border-radius: 12px;
            padding: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); border: 1px solid #1e293b;
            min-height: 340px; display: flex; flex-direction: column; justify-content: space-between;
        }
        
        .text-center { text-align: center; }
        .hidden { display: none !important; }
        
        .title { font-size: 15px; font-weight: 900; letter-spacing: 0.5px; color: #f1f5f9; text-transform: uppercase; }
        .subtitle { font-size: 10px; color: #64748b; margin-top: 1px; }
        
        /* Khung Đăng Nhập siêu nhỏ gọn */
        .login-section { margin-top: 8px; background: #1e293b; padding: 8px; border-radius: 8px; border: 1px solid #334155; }
        .section-label { font-size: 9px; font-weight: bold; margin-bottom: 4px; display: flex; align-items: center; gap: 3px; text-transform: uppercase; }
        .label-user { color: #3b82f6; }
        .label-admin { color: #f59e0b; }
        
        .input-field { width: 100%; padding: 6px; border-radius: 5px; border: 1px solid #475569; background-color: #0f172a; color: white; font-size: 11px; outline: none; margin-bottom: 6px; text-align: center; }
        
        .divider { text-align: center; font-size: 9px; color: #475569; font-weight: bold; margin: 6px 0; }
        
        /* Nút bấm mini */
        .btn { width: 100%; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; color: white; padding: 8px; font-size: 11px; text-transform: uppercase; transition: transform 0.1s; }
        .btn:active { transform: scale(0.96); }
        .btn-blue { background-color: #2563eb; }
        .btn-red { background-color: #dc2626; }
        .btn-purple { background-color: #8b5cf6; font-size: 12px; padding: 9px; margin-top: 10px; }
        .btn-emerald { background-color: #10b981; margin-top: 8px; }
        .btn-slate { background-color: #475569; margin-top: 5px; font-size: 9px; padding: 5px; }
        
        /* 4 ô màu xúc xắc siêu mini */
        .grid-4 { display: grid; grid-template-cols: repeat(4, 1fr); gap: 4px; margin-top: 10px; }
        .color-card { background-color: #ffffff; border: 2px solid #cbd5e1; border-radius: 8px; padding: 2px; }
        .color-inner { width: 100%; aspect-ratio: 1/1; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: #94a3b8; }
        .color-name { font-size: 8px; font-weight: 900; color: #cbd5e1; margin-top: 2px; display: block; height: 10px; text-align: center; }
        
        /* Hộp trạng thái Admin gài màu */
        .status-box { padding: 6px; border-radius: 6px; font-size: 9px; text-align: center; margin-top: 8px; border: 1px solid #334155; background-color: rgba(30,41,59,0.5); color: #94a3b8; }
        .status-active { border-color: #10b981; background-color: rgba(6,78,59,0.3); color: #34d399; font-weight: bold; }
        
        .footer-version { text-align: center; font-size: 8px; color: #334155; border-top: 1px solid rgba(51,65,85,0.2); padding-top: 4px; margin-top: 8px; }
        .error-text { color: #f87171; font-size: 9px; margin-bottom: 4px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <div>
            <div class="text-center" style="margin-bottom: 4px;">
                <h1 class="title">ROLL COLOR DICE</h1>
                <p id="app-subtitle" class="subtitle">Vui lòng đăng nhập</p>
            </div>

            <div id="screen-login">
                <div class="login-section">
                    <div class="section-label label-user">👤 Dành cho người thường</div>
                    <input id="login-user-name" class="input-field" type="text" value="vitvang" readonly>
                    <button class="btn btn-blue" onclick="switchView('user')">ĐĂNG NHẬP NGƯỜI THƯỜNG</button>
                </div>

                <div class="divider">HOẶC</div>

                <div class="login-section">
                    <div class="section-label label-admin">🔑 Dành cho Admin (Quản lý)</div>
                    <input id="login-admin-pass" class="input-field" type="password" placeholder="Mật khẩu Admin...">
                    <div id="login-error-msg" class="error-text">Mật khẩu không đúng!</div>
                    <button class="btn btn-red" onclick="loginAsAdmin()">ĐĂNG NHẬP ADMIN</button>
                </div>
            </div>

            <div id="screen-user" class="hidden">
                <div class="grid-4" id="dice-container">
                    <div><div class="color-card"><div class="color-inner" style="background-color: #334155;">?</div></div><span class="color-name"></span></div>
                    <div><div class="color-card"><div class="color-inner" style="background-color: #334155;">?</div></div><span class="color-name"></span></div>
                    <div><div class="color-card"><div class="color-inner" style="background-color: #334155;">?</div></div><span class="color-name"></span></div>
                    <div><div class="color-card"><div class="color-inner" style="background-color: #334155;">?</div></div><span class="color-name"></span></div>
                </div>
                <button id="btn-random" class="btn btn-purple" onclick="rollDice()">RANDOM</button>
                <button class="btn btn-slate" onclick="logout()">Đăng xuất</button>
            </div>

            <div id="screen-admin" class="hidden">
                <p style="text-align: center; font-size: 9px; color: #94a3b8;">Chạm từng ô để chọn màu (cho phép trùng nhau):</p>
                
                <div class="grid-4">
                    <div onclick="cycleSlotColor(0)" style="cursor: pointer;">
                        <div class="color-card"><div id="as-0" class="color-inner" style="background-color:#334155; font-size:9px; color:white">Chạm</div></div>
                        <span id="asn-0" class="color-name">---</span>
                    </div>
                    <div onclick="cycleSlotColor(1)" style="cursor: pointer;">
                        <div class="color-card"><div id="as-1" class="color-inner" style="background-color:#334155; font-size:9px; color:white">Chạm</div></div>
                        <span id="asn-1" class="color-name">---</span>
                    </div>
                    <div onclick="cycleSlotColor(2)" style="cursor: pointer;">
                        <div class="color-card"><div id="as-2" class="color-inner" style="background-color:#334155; font-size:9px; color:white">Chạm</div></div>
                        <span id="asn-2" class="color-name">---</span>
                    </div>
                    <div onclick="cycleSlotColor(3)" style="cursor: pointer;">
                        <div class="color-card"><div id="as-3" class="color-inner" style="background-color:#334155; font-size:9px; color:white">Chạm</div></div>
                        <span id="asn-3" class="color-name">---</span>
                    </div>
                </div>

                <div id="admin-status-text" class="status-box">Chưa gài màu. Người thường quay NGẪU NHIÊN.</div>

                <button class="btn btn-emerald" onclick="saveAdminColors()">LƯU VÀ CÀI MÀU</button>
                <button class="btn btn-slate" style="background-color: #d97706;" onclick="resetAdminColors()">XÓA MÀU CÀI (RA NGẪU NHIÊN)</button>
                <button class="btn btn-slate" onclick="logout()">Thoát Admin</button>
            </div>
        </div>

        <div class="footer-version">
            <span>v4.3.0 (Siêu Mini & Logic Chuẩn)</span>
        </div>
    </div>

    <script>
        const ALL_COLORS = [
            { id: 'red', name: 'ĐỎ', hex: '#ef4444' },
            { id: 'yellow', name: 'VÀNG', hex: '#eab308' },
            { id: 'green', name: 'LÁ', hex: '#22c55e' },
            { id: 'blue', name: 'DƯƠNG', hex: '#3b82f6' },
            { id: 'purple', name: 'TÍM', hex: '#a855f7' },
            { id: 'pink', name: 'HỒNG', hex: '#ec4899' },
            { id: 'orange', name: 'CAM', hex: '#f97316' }
        ];

        // Mặc định ban đầu của Admin
        let adminSlots = ['red', 'red', 'red', 'red'];

        function switchView(viewName) {
            const loginScr = document.getElementById('screen-login');
            const userScr = document.getElementById('screen-user');
            const adminScr = document.getElementById('screen-admin');
            const subtitle = document.getElementById('app-subtitle');

            loginScr.classList.add('hidden');
            userScr.classList.add('hidden');
            adminScr.classList.add('hidden');

            if (viewName === 'login') {
                loginScr.classList.remove('hidden');
                subtitle.innerText = 'Vui lòng đăng nhập';
                subtitle.style.color = '#64748b';
            } else if (viewName === 'user') {
                userScr.classList.remove('hidden');
                subtitle.innerText = 'Giao diện người thường';
                subtitle.style.color = '#3b82f6';
                // Reset giao diện hiển thị xúc xắc khi quay về màn hình người thường
                resetUserDiceUI();
            } else if (viewName === 'admin') {
                adminScr.classList.remove('hidden');
                subtitle.innerText = 'Giao diện Admin';
                subtitle.style.color = '#ef4444';
            }
        }

        function loginAsAdmin() {
            const passwordInput = document.getElementById('login-admin-pass');
            const errorMsg = document.getElementById('login-error-msg');
            
            if (passwordInput.value === '24') {
                errorMsg.style.display = 'none';
                passwordInput.value = '';
                
                const savedData = localStorage.getItem('gai_mau');
                if (savedData) {
                    adminSlots = JSON.parse(savedData);
                } else {
                    adminSlots = ['red', 'red', 'red', 'red'];
                }
                
                switchView('admin');
                renderAdminSlots();
                updateAdminStatusUI();
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function logout() {
            switchView('login');
        }

        function resetUserDiceUI() {
            const container = document.getElementById('dice-container');
            const innerBoxes = container.querySelectorAll('.color-inner');
            const nameLabels = container.querySelectorAll('.color-name');
            innerBoxes.forEach(box => {
                box.style.backgroundColor = '#334155';
                box.innerText = '?';
            });
            nameLabels.forEach(lbl => lbl.innerText = '');
        }

        // Chạm đổi xoay vòng cho phép trùng lặp màu thoải mái
        function cycleSlotColor(index) {
            const currentId = adminSlots[index];
            const currentIndex = ALL_COLORS.findIndex(c => c.id === currentId);
            const nextIndex = (currentIndex + 1) % ALL_COLORS.length;
            adminSlots[index] = ALL_COLORS[nextIndex].id;
            renderAdminSlots();
        }

        function renderAdminSlots() {
            adminSlots.forEach((colorId, idx) => {
                const colorObj = ALL_COLORS.find(c => c.id === colorId);
                const elBox = document.getElementById(`as-${idx}`);
                const elName = document.getElementById(`asn-${idx}`);
                if (elBox && elName) {
                    elBox.style.backgroundColor = colorObj.hex;
                    elBox.innerText = '';
                    elName.innerText = colorObj.name;
                }
            });
        }

        function saveAdminColors() {
            localStorage.setItem('gai_mau', JSON.stringify(adminSlots));
            alert('Đã gài đặt bộ màu thành công!');
            updateAdminStatusUI();
            logout();
        }

        function resetAdminColors() {
            localStorage.removeItem('gai_mau');
            adminSlots = ['red', 'red', 'red', 'red'];
            renderAdminSlots();
            alert('Đã xóa gài màu! Người thường quay sẽ ra ngẫu nhiên.');
            updateAdminStatusUI();
        }

        function updateAdminStatusUI() {
            const statusEl = document.getElementById('admin-status-text');
            if (!statusEl) return;
            
            const isSaved = localStorage.getItem('gai_mau');
            if (isSaved) {
                statusEl.className = "status-box status-active";
                statusEl.innerText = "Đã gài màu! Người thường quay sẽ ra chính xác bộ này.";
            } else {
                statusEl.className = "status-box";
                statusEl.innerText = "Chưa gài màu. Người thường quay sẽ ra NGẪU NHIÊN.";
            }
        }

        // HÀM QUAY SỐ LOGIC CHUẨN ĐÚNG THEO Ý BẠN
        function rollDice() {
            const btn = document.getElementById('btn-random');
            const container = document.getElementById('dice-container');
            const nameLabels = container.querySelectorAll('.color-name');
            const innerBoxes = container.querySelectorAll('.color-inner');
            
            let finalColors = [];
            const savedData = localStorage.getItem('gai_mau');

            if (savedData) {
                // NẾU ADMIN CÓ CÀI MÀU: Ra đúng bộ màu admin đã gài
                const list = JSON.parse(savedData);
                finalColors = list.map(id => ALL_COLORS.find(c => c.id === id));
                localStorage.removeItem('gai_mau'); // Xóa gài màu sau khi dùng để lần sau quay trở lại ngẫu nhiên
            } else {
                // NẾU ADMIN KHÔNG CÀI: Ra ngẫu nhiên hoàn toàn
                for (let i = 0; i < 4; i++) {
                    const randomIndex = Math.floor(Math.random() * ALL_COLORS.length);
                    finalColors.push(ALL_COLORS[randomIndex]);
                }
            }

            // Hiển thị kết quả lên giao diện xúc xắc người thường
            finalColors.forEach((colorObj, idx) => {
                if (innerBoxes[idx] && nameLabels[idx]) {
                    innerBoxes[idx].style.backgroundColor = colorObj.hex;
                    innerBoxes[idx].innerText = '';
                    nameLabels[idx].innerText = colorObj.name;
                }
            });
        }
    </script>
</body>
</html>
